<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ראשי</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../binder.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/icon_512.png">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

</head>

<body>

    <!-- ===============================
         TOP NAV (Desktop + Mobile Logout)
         =============================== -->
    <nav class="top-nav">
        <!-- Desktop links (hidden on mobile) -->
        <div class="desktop-links">
            <a href="index.html">ראשי</a>
            <a href="upload.html">העלאה</a>
            <a href="my-recipes.html">המתכונים שלי</a>
        </div>

        <!-- User controls (visible always, but only logout matters on mobile) -->
        <div class="user-controls">
            <span class="user-greeting">שלום משתמש</span>
            <a href="#" class="logout-btn">התנתק</a>
        </div>
    </nav>

    <!-- ===============================
         MAIN CONTENT
         =============================== -->
    <main id="magazine-main">
        <!-- GLOBAL SEARCH & MAGAZINE GRID VIEW -->
        <div id="magazine-home-view">
            <h1 style="text-align: center; margin-bottom: 20px;">מתכונים</h1>
            <div class="search-container" style="margin-bottom: 40px;">
                <input type="text" id="global-search" placeholder="חפש מתכון בכל המאגר..." 
                    style="width: 100%; padding: 18px; font-size: 1.2rem; border: 2px solid var(--color-dark); border-radius: 4px; outline: none; font-family: var(--font-sans); box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            </div>
            
            <div id="magazine-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">
                <!-- Category Photo Cards will be injected here -->
                <p>טוען מתכונים...</p>
            </div>
        </div>

        <!-- CATEGORY VIEW (Hidden by default) -->
        <div id="category-view" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button id="back-to-magazine" class="back-btn">
                    <span class="material-symbols-outlined">arrow_forward</span>
                    חזור לכל המתכונים
                </button>
            </div>
            
            <!-- Dynamic Banner -->
            <div id="category-banner" style="width: 100%; height: 220px; background-size: cover; background-position: center; border-radius: 4px; display: flex; align-items: flex-end; padding: 25px 20px; margin-bottom: 25px; position: relative; border: 1px solid rgba(0,0,0,0.1); box-sizing: border-box;">
                <div style="position: absolute; top: 12px; bottom: 12px; left: 12px; right: 12px; border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 2px; pointer-events: none;"></div>
                <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); border-radius: 4px; pointer-events: none;"></div>
                <h1 id="selected-category-title" style="color: white; margin: 0; position: relative; z-index: 1; text-align: right; text-shadow: 0 2px 5px rgba(0,0,0,0.5); font-size: 2.2rem;">שם קטגוריה</h1>
            </div>

            <div class="search-container" style="margin-bottom: 30px;">
                <input type="text" id="scoped-search" placeholder="חפש בקטגוריה זו..." 
                    style="width: 100%; padding: 14px; font-size: 1.1rem; border: 1px solid var(--color-dark); border-radius: 2px; outline: none;">
            </div>

            <div id="filtered-recipes-list" class="recipe-grid"></div>
        </div>
    </main>

    <!-- ===============================
         MOBILE BOTTOM NAV (Only Mobile)
         =============================== -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="material-symbols-outlined icon">home</span>
            <span>ראשי</span>
        </a>

        <a href="upload.html" class="nav-item">
            <span class="material-symbols-outlined icon">upload</span>
            <span>העלאה</span>
        </a>

        <a href="my-recipes.html" class="nav-item">
            <span class="material-symbols-outlined icon">menu_book_2</span>
            <span>שלי</span>
        </a>
    </nav>
        
    <!-- ===============================
         JS
         =============================== -->
    <script type="module" src="../js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed', err));
            });
        }
    </script>

</body>
</html>
