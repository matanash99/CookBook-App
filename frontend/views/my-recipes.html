<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המתכונים שלי</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preload" href="../assets/fonts/DanaYad.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="stylesheet" href="../binder.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/icon_512.png">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

</head>
<body>
    <!-- ===============================
         TOP NAV (Desktop + Mobile Logout)
         =============================== -->
    <nav class="top-nav">
        <!-- Desktop links (hidden on mobile) -->
        <div class="desktop-links">
            <a href="index.html">ראשי</a>
            <a href="upload.html">העלאה</a>
            <a href="my-recipes.html">המתכונים שלי</a>
        </div>

        <!-- User controls (visible always, but only logout matters on mobile) -->
        <div class="user-controls">
            <span class="user-greeting">שלום משתמש</span>
            <a href="#" class="logout-btn">התנתק</a>
        </div>
    </nav>


    <main id="my-recipes-main">
        <!-- LIBRARY VIEW -->
        <div id="library-view">
            <h1>הספרייה שלי</h1>
            <p class="library-subtitle">בחר קלסר מתכונים כדי להתחיל</p>
            
            <div id="binder-shelf" class="binder-grid">
                <!-- Binders will be injected here -->
                <p>טוען קלסרים...</p>
            </div>
        </div>

        <!-- OPEN BINDER VIEW (Hidden by default) -->
        <div id="open-book-view" style="display: none;">
            <div class="open-book-header">
                <button id="close-book-btn" class="back-btn">
                    <span class="material-symbols-outlined">arrow_forward</span>
                    חזור לספרייה
                </button>
                <h2 id="open-book-title">שם הקלסר</h2>
                <div class="book-search-container">
                    <span class="material-symbols-outlined">search</span>
                    <input type="text" id="book-search" placeholder="חפש בקלסר...">
                </div>
            </div>

            <!-- The Physical Page Area -->
            <div class="binder-page-container">
                <div class="metal-rings-container"></div>
                <div class="binder-page" id="binder-page-content">
                    <!-- Table of contents or Recipe content goes here -->
                </div>
                <!-- Navigation Area -->
                <button id="prev-page-btn" class="page-nav-btn prev-btn" style="display:none;">הקודם</button>
                <button id="next-page-btn" class="page-nav-btn next-btn" style="display:none;">הבא</button>
                <div class="dog-ear" id="page-dog-ear"></div>
            </div>
        </div>
    </main>
    <!-- ===============================
         MOBILE BOTTOM NAV (Only Mobile)
         =============================== -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="material-symbols-outlined icon">home</span>
            <span>ראשי</span>
        </a>

        <a href="upload.html" class="nav-item">
            <span class="material-symbols-outlined icon">upload</span>
            <span>העלאה</span>
        </a>

        <a href="my-recipes.html" class="nav-item">
            <span class="material-symbols-outlined icon">menu_book_2</span>
            <span>שלי</span>
        </a>
    </nav>

    <script type="module" src="../js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed', err));
            });
        }
    </script>
</body>
</html>
